<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kanhaiya Adhikari | Portfolio</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth;scroll-snap-type:y mandatory}
body{
    font-family:'Segoe UI',sans-serif;
    background:#000;
    color:#e0e0e0;
    overflow-x:hidden;
}

#bgCanvas{
    position:fixed;
    inset:0;
    z-index:-1;
    background:#000;
}

/* NAVBAR */
.navbar{
    position:fixed;
    top:0;
    width:100%;
    padding:1rem;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(6px);
    display:flex;
    justify-content:center;
    z-index:10;
}
.nav-links {
    display: flex;
    gap: 2rem;
}
.nav-links a{
    color:#fff;
    text-decoration:none;
    padding:.4rem .9rem;
    border-radius:6px;
    transition:.25s;
}
.nav-links a:hover{
    color:#ff4d4d;
    transform:scale(1.1);
    box-shadow:0 0 12px rgba(255,77,77,.6);
}

/* SECTIONS */
section{
    min-height:100vh;
    scroll-snap-align:start;
    padding:6rem 1.5rem;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
}
h2{text-align:center;margin-bottom:2.5rem;color:#00f7ff}

/* HERO */
.hero{text-align:center; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.hero img.hero-logo{
    height:120px;
    margin-bottom:1.5rem;
}
.hero h1{font-size:3.2rem}
.hero p{margin-top:1rem;font-size:1.2rem;color:#ccc}
.hero .btn{
    margin-top:2rem;
    padding:.7rem 2rem;
    background:#0a0a0a;
    border:2px solid #ffd43b;
    color:#fff;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
}
.hero .btn:hover{
    transform:scale(1.12);
    box-shadow:0 0 35px rgba(255,212,59,.6);
}

/* SKILLS */
.skills-list{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:1.5rem;
    list-style:none;
}
.skill-item{
    padding:.8rem 1.6rem;
    background:#0a0a0a;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,247,255,.25);
    transition:.3s;
}
.skill-item:hover{
    transform:scale(1.2);
    box-shadow:0 0 30px rgba(0,247,255,.6);
}

/* CONTACT */
.contact-form{
    max-width:500px;
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:1rem;
    padding:2rem;
    background:rgba(0,0,0,.8);
    border-radius:12px;
    border:2px solid rgba(0,247,255,.5);
}
.contact-form input,
.contact-form textarea{
    padding:.9rem;
    background:#0a0a0a;
    border:2px solid rgba(0,247,255,.4);
    border-radius:6px;
    color:#fff;
}
.contact-form button{
    padding:.8rem;
    background:#0a0a0a;
    border:2px solid #ffd43b;
    color:#fff;
    border-radius:8px;
    cursor:pointer;
}

/* TABLE */
.backend-table{
    margin:auto;
    margin-top:1rem;
    border-collapse:collapse;
    width:90%;
    max-width:600px;
    background:rgba(0,0,0,.8);
    border:2px solid rgba(0,247,255,.5);
    color:#fff;
    text-align:center;
}
.backend-table th,
.backend-table td{
    border:1px solid rgba(0,247,255,.5);
    padding:0.7rem;
}

/* CLEAR BUTTON */
.clear-btn{
    margin-top:1rem;
    padding:.6rem 1.5rem;
    background:#111;
    border:2px solid #ff4d4d;
    color:#fff;
    border-radius:8px;
    cursor:pointer;
}
.clear-btn:hover{
    box-shadow:0 0 15px rgba(255,77,77,.7);
}
</style>
</head>

<body>

<section id="contact">
<h2>Contact</h2>

<form class="contact-form" id="contactForm">
<input id="nameInput" placeholder="Your Name" required>
<input id="emailInput" type="email" placeholder="Your Email" required>
<textarea id="messageInput" placeholder="Message" required></textarea>
<button type="submit">Send</button>
</form>

<h3 style="text-align:center;margin-top:2rem;color:#00f7ff;">
Stored Messages:
</h3>

<table class="backend-table" id="backendTable">
<tr>
<th>Name</th>
<th>Email</th>
<th>Message</th>
</tr>
</table>

<button class="clear-btn" id="clearData">Clear All Messages</button>

</section>

<script>
const contactForm = document.getElementById("contactForm");
const backendTable = document.getElementById("backendTable");
const clearBtn = document.getElementById("clearData");

// Load saved data
window.addEventListener("DOMContentLoaded", () => {
    const savedData = JSON.parse(localStorage.getItem("contactData")) || [];
    savedData.forEach(entry => addRow(entry.name, entry.email, entry.message));
});

// Submit form
contactForm.addEventListener("submit", function(e){
    e.preventDefault();

    const name = document.getElementById("nameInput").value;
    const email = document.getElementById("emailInput").value;
    const message = document.getElementById("messageInput").value;

    const newEntry = { name, email, message };

    const existingData = JSON.parse(localStorage.getItem("contactData")) || [];
    existingData.push(newEntry);

    localStorage.setItem("contactData", JSON.stringify(existingData));

    addRow(name, email, message);
    contactForm.reset();
});

// Add row to table
function addRow(name, email, message) {
    const newRow = document.createElement("tr");
    newRow.innerHTML = `
        <td>${name}</td>
        <td>${email}</td>
        <td>${message}</td>
    `;
    backendTable.appendChild(newRow);
}

// Clear all data
clearBtn.addEventListener("click", () => {
    localStorage.removeItem("contactData");
    backendTable.innerHTML = `
        <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Message</th>
        </tr>
    `;
});
</script>

</body>
</html>
